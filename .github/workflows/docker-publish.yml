name: Build, Push & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  IMAGE_NAME: ya-tg

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            # latest 只在 main 分支更新；tag 构建不覆盖它，保证历史版本可稳定拉取
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Ensure DockerHub repository is public
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            JWT=$(curl -fsS -X POST -H 'Content-Type: application/json' \
              -d "{\"username\":\"${DH_USER}\",\"password\":\"${DH_TOKEN}\"}" \
              https://hub.docker.com/v2/users/login/ | python3 -c 'import sys,json;print(json.load(sys.stdin).get("token",""))')
            [ -n "$JWT" ] && break
            sleep 5
          done
          [ -n "$JWT" ] || { echo "DockerHub login failed"; exit 1; }
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' -X PATCH \
            -H "Authorization: JWT ${JWT}" -H 'Content-Type: application/json' \
            -d '{"is_private":false}' \
            "https://hub.docker.com/v2/repositories/${DH_USER}/${IMAGE_NAME}/")
          echo "set public HTTP ${CODE}"
          [ "$CODE" = "200" ] || { echo "failed to make repository public"; exit 1; }

  release:
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate release notes from CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/changelog_for_release.py "$TAG" > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Ya-TG ${{ github.ref_name }}
          body_path: release_notes.md
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
