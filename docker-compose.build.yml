# 仅在需要自己改源码构建时使用：docker compose -f docker-compose.build.yml up -d --build
# 普通用户请直接使用 docker-compose.yml（拉取官方镜像，无需构建）。
services:
  ya-tg:
    build: .
    image: ya-tg:local
    container_name: ya-tg
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8787}:8787"
    env_file:
      - ./.env
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: sqlite:////app/db/ya-tg.db
    volumes:
      - ./db:/app/db
      - ./logs:/app/logs
      # v2.1.8 #241：Telegram 登录会话（等同账号凭据，只落本地磁盘）。
      - ./data:/app/data
    # v0.8.3：容器 stdout 日志硬限额，避免 docker json-file 无限增长
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
