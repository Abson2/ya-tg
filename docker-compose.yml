# Ya-TG 部署文件：直接拉取 DockerHub 官方镜像，无需源码、无需构建。
# 使用方法：把本文件与 .env 放在同一目录，执行 docker compose up -d
services:
  ya-tg:
    image: abson2/ya-tg:${IMAGE_TAG:-latest}
    container_name: ya-tg
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8787}:8787"
    env_file:
      - ./.env
    environment:
      TZ: Asia/Shanghai
      # 容器内数据库路径；对应宿主机 ./db/ya-tg.db
      DATABASE_URL: sqlite:////app/db/ya-tg.db
    volumes:
      - ./db:/app/db
      - ./logs:/app/logs
      # v2.1.8 #241：Telegram 登录会话（等同账号凭据，只落本地磁盘）。
      # 挂上它，容器重建 / 升级不必重新走验证码登录；不启用阅读量统计则无副作用。
      - ./data:/app/data
    # v0.8.3：容器 stdout 日志硬限额，避免 docker json-file 无限增长
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
